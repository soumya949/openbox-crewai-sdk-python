[project]
name = "openbox-crewai-sdk-python"
version = "3.0.0"
description = "OpenBox SDK - Governance and observability for CrewAI agent workflows"
authors = [
    { name = "OpenBox Team", email = "tony@openbox.ai" },
]
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = "MIT"
keywords = ["crewai", "agent", "flow", "crew", "governance", "observability", "opentelemetry", "hitl", "human-in-the-loop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "crewai>=1.14.1",
    # Governance contracts, identity/signing, client and instrumentation.
    "openbox-sdk-python[http]>=1.5.0",
]

[project.optional-dependencies]
# Database instrumentation (SQLAlchemy, DB-API, asyncpg, redis, pymongo).
db = ["openbox-sdk-python[db]>=1.5.0"]

[project.urls]
Homepage = "https://github.com/OpenBox-AI/openbox-crewai-sdk-python"
Documentation = "https://github.com/OpenBox-AI/openbox-crewai-sdk-python#readme"
Repository = "https://github.com/OpenBox-AI/openbox-crewai-sdk-python.git"
Issues = "https://github.com/OpenBox-AI/openbox-crewai-sdk-python/issues"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.26.0,<0.27",
    "ruff>=0.4.0",
    "pyright>=1.1.390",
    "pytest-cov>=7.0.0",
    # e2e suites drive real drivers and load .env files.
    "openbox-sdk-python[db]>=1.5.0",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openbox"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
