[project]
name = "demo_03_flow"
version = "0.1.0"
description = "OpenBox-governed CrewAI Flow demo — 2 crews, 3 signed agents (sync + async)"
authors = [{ name = "OpenBox Team", email = "tony@openbox.ai" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai[tools]>=1.14.1",
    "python-dotenv>=1.1.1",
    "openbox-crewai-sdk-python",
]

[project.scripts]
demo_03_flow = "demo_03_flow.main:kickoff"
kickoff = "demo_03_flow.main:kickoff"
kickoff_async = "demo_03_flow.main:kickoff_async"
plot = "demo_03_flow.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"

[tool.uv.sources]
openbox-crewai-sdk-python = { path = "../..", editable = true }
