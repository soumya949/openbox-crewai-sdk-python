# SonarQube configuration for openbox-crewai-sdk-python
sonar.projectKey=openbox-crewai-sdk-python
sonar.projectName=openbox-crewai-sdk-python
sonar.sources=openbox
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py
sonar.sourceEncoding=UTF-8

# Python and coverage configuration
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=docs/**,demo/**,openbox_logs/**,tests/**,**/__pycache__/**,.venv/**
sonar.coverage.exclusions=demo/**,tests/** 
